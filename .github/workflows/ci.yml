name: CI

on:
  push:
    branches: [main]
  pull_request:

# No device is attached and none is needed. The tests that would require one are
# the ones that shell out to adb, and they are not part of the suite. What runs
# here is the logic that decides things — flow generation, evidence
# de-duplication, attribution ordering — which is precisely what should be
# verified on every push.
#
# If `ruff check` fails on formatting, run `ruff check --fix .` locally first.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest-output.txt
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo "### Pytest failure output"
              echo '```'
              tail -c 8000 pytest-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f pytest-output.txt
          exit "$code"
